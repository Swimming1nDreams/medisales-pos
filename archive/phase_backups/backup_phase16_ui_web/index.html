<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medisales Pharmacy & Retail Management</title>
    <link href="output.css" rel="stylesheet">
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body class="bg-slate-100 text-slate-900 h-screen overflow-hidden flex select-none font-sans">

    <!-- Desktop Sidebar Navigation -->
    <aside class="w-60 bg-slate-900 flex-shrink-0 flex flex-col h-full text-slate-400 border-r border-slate-800">
        <!-- Brand Header -->
        <div class="h-14 flex items-center px-4 border-b border-slate-800 gap-3">
            <div class="w-8 h-8 rounded-md bg-teal-700 flex items-center justify-center text-white font-bold shadow-sm flex-shrink-0 border border-teal-600">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </div>
            <div class="min-w-0 flex-1">
                <div class="flex items-center gap-1.5">
                    <h1 class="text-white font-bold text-sm tracking-wide leading-tight truncate">Medisales</h1>
                    <span class="text-[9px] font-bold uppercase tracking-wider bg-teal-950 text-teal-400 px-1.5 py-0.2 rounded border border-teal-800">POS</span>
                </div>
                <p class="text-[10px] text-slate-400 font-medium tracking-tight truncate mt-0.5">Pharmacy & Retail Manager</p>
            </div>
        </div>

        <!-- Navigation Menu Container -->
        <div class="flex-1 overflow-y-auto py-3 px-2.5 space-y-4" id="nav-container">
            <!-- Navigation sections injected here via main.js -->
        </div>

        <!-- System Status Footer -->
        <div class="p-3 border-t border-slate-800/90 bg-slate-950/40">
            <div class="bg-slate-800/80 rounded-md p-2 flex items-center justify-between border border-slate-700/60">
                <div class="flex items-center gap-2 min-w-0">
                    <span class="relative flex h-2 w-2 flex-shrink-0">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    <div class="text-[10px] leading-tight min-w-0">
                        <span class="font-semibold text-slate-200 block truncate">Standalone Offline</span>
                        <span class="text-slate-400 text-[9px] block">SQLite WAL &bull; v2.4</span>
                    </div>
                </div>
                <span class="text-[9px] font-mono text-emerald-400 bg-emerald-950/80 px-1.5 py-0.5 rounded border border-emerald-800/80">Active</span>
            </div>
        </div>
    </aside>

    <!-- Main Desktop Workspace -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative bg-slate-100">
        
        <!-- Application Top Chrome / Header -->
        <header class="h-14 bg-white border-b border-slate-200 flex items-center px-4 md:px-5 flex-shrink-0 justify-between shadow-xs z-10 gap-3">
            <div class="flex items-center gap-2.5 min-w-0 flex-shrink">
                <span id="page-badge" class="text-[10px] font-bold uppercase tracking-wider text-teal-800 bg-teal-50 px-2 py-0.5 rounded border border-teal-200/80 whitespace-nowrap flex-shrink-0">OPERATIONS</span>
                <h2 id="page-title" class="text-sm font-bold text-slate-900 tracking-tight whitespace-nowrap flex-shrink-0">Dashboard</h2>
                <span class="text-slate-300 hidden lg:inline flex-shrink-0">|</span>
                <span id="page-subtitle" class="text-xs text-slate-500 whitespace-nowrap overflow-hidden text-ellipsis hidden lg:inline max-w-sm">Store summary & financial performance</span>
            </div>
            
            <div class="flex items-center gap-2.5 flex-shrink-0">
                <!-- Counter & Date Tag (displayed on large displays, omitted on standard 1280px to avoid crowding) -->
                <div class="hidden 2xl:flex items-center gap-2 text-xs text-slate-500 bg-slate-50 border border-slate-200 px-2.5 py-1 rounded whitespace-nowrap">
                    <span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span>
                    <span class="font-medium text-slate-700">Central Counter</span>
                    <span class="text-slate-300">&bull;</span>
                    <span class="font-mono text-slate-600 text-[11px]" id="system-date-display">2026-10-11</span>
                </div>

                <!-- Page Action Buttons Toolbar -->
                <div id="header-actions" class="flex items-center gap-2 flex-shrink-0"></div>

                <!-- Language Switcher Pill -->
                <div class="flex items-center bg-slate-100 p-0.5 rounded border border-slate-200 text-[11px] font-medium flex-shrink-0" id="lang-switcher-pill">
                    <button id="lang-btn-en" class="px-2 py-0.5 rounded transition-all text-slate-700 hover:text-slate-900" onclick="setLanguage('en')">EN</button>
                    <button id="lang-btn-my" class="px-2 py-0.5 rounded transition-all text-slate-700 hover:text-slate-900" onclick="setLanguage('my')">မြန်မာ</button>
                </div>
            </div>
        </header>

        <!-- Main Page Viewport -->
        <div class="flex-1 overflow-auto p-4 md:p-5 relative" id="scroll-container">
            <!-- Loading Indicator -->
            <div id="loading-overlay" class="absolute inset-0 bg-white/70 backdrop-blur-xs z-40 flex items-center justify-center hidden">
                <div class="bg-white px-4 py-2.5 rounded-md shadow-md border border-slate-200 text-teal-800 font-medium flex items-center gap-2.5 text-xs">
                    <svg class="animate-spin h-4 w-4 text-teal-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                      <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                      <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <span>Loading system data...</span>
                </div>
            </div>
            
            <!-- Page Container -->
            <div id="content-area" class="w-full h-full flex flex-col">
                <!-- Injected page content -->
            </div>
        </div>
        
        <!-- Toast Notifications -->
        <div id="toast-container" class="fixed top-3 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

        <!-- Global Modal Dialog Backdrop -->
        <div id="modal-backdrop" class="fixed inset-0 bg-slate-900/50 z-50 hidden flex items-center justify-center backdrop-blur-xs transition-opacity duration-150 p-4">
            <div id="modal-content" class="bg-white rounded-lg shadow-xl max-w-lg w-full transform scale-95 opacity-0 transition-all duration-150 max-h-[92vh] flex flex-col overflow-hidden border border-slate-200">
                <!-- Modal content injected here -->
            </div>
        </div>

    </main>

    <!-- Internationalization & Localization -->
    <script src="js/i18n.js"></script>
    <!-- Global App Engine -->
    <script src="js/main.js"></script>
    <!-- Page Modules -->
    <script src="js/pages/dashboard.js"></script>
    <script src="js/pages/sales.js"></script>
    <script src="js/pages/products.js"></script>
    <script src="js/pages/inventory.js"></script>
    <script src="js/pages/purchases.js"></script>
    <script src="js/pages/suppliers.js"></script>
    <script src="js/pages/expenses.js"></script>
    <script src="js/pages/reports.js"></script>
    <script src="js/pages/settings.js"></script>
</body>
</html>
